name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests compile Java with the pinned JDK; setup-java sets JAVA_HOME to it.
      # The exact Temurin build the book's numbers come from. setup-java's version matching
      # can't resolve a build number on every runner, so download it from Adoptium.
      - name: Download Temurin 25.0.5+8
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then os=mac; else os=linux; fi
          if [ "$RUNNER_ARCH" = ARM64 ]; then arch=aarch64; else arch=x64; fi
          curl -fsSL -o "$RUNNER_TEMP/jdk.tar.gz" \
            "https://api.adoptium.net/v3/binary/version/jdk-25.0.5%2B8/$os/$arch/jdk/hotspot/normal/eclipse"
          echo "JDK_FILE=$RUNNER_TEMP/jdk.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          jdkFile: ${{ env.JDK_FILE }}
          java-version: "25.0.5"
      # rustup reads rust-toolchain.toml and installs the pinned toolchain with rustfmt and clippy.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every challenge's tests, each compiled on its own (see xtask/src/check.rs).
      - run: cargo xtask check all

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux. carafe always ends a line with \n, while HotSpot on Windows
        # writes \r\n, so the tests that compare the two can't pass there (use WSL).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The exact Temurin build the book's numbers come from. setup-java's version matching
      # can't resolve a build number on every runner, so download it from Adoptium.
      - name: Download Temurin 25.0.5+8
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then os=mac; else os=linux; fi
          if [ "$RUNNER_ARCH" = ARM64 ]; then arch=aarch64; else arch=x64; fi
          curl -fsSL -o "$RUNNER_TEMP/jdk.tar.gz" \
            "https://api.adoptium.net/v3/binary/version/jdk-25.0.5%2B8/$os/$arch/jdk/hotspot/normal/eclipse"
          echo "JDK_FILE=$RUNNER_TEMP/jdk.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          jdkFile: ${{ env.JDK_FILE }}
          java-version: "25.0.5"
      - run: rustup show
      - run: cargo test --workspace --no-fail-fast
