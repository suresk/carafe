name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tests compile Java with the pinned JDK; setup-java sets JAVA_HOME to it.
      # The exact Temurin build the book's numbers come from. setup-java's version matching
      # can't resolve a build number on every runner, so download it from Adoptium.
      - name: Download Temurin 25.0.5+8
        shell: bash
        run: |
          os=$(case "$RUNNER_OS" in Linux) echo linux;; macOS) echo mac;; Windows) echo windows;; esac)
          arch=$(case "$RUNNER_ARCH" in X64) echo x64;; ARM64) echo aarch64;; esac)
          ext=$([ "$os" = windows ] && echo zip || echo tar.gz)
          curl -fsSL -o "$RUNNER_TEMP/jdk.$ext" \
            "https://api.adoptium.net/v3/binary/version/jdk-25.0.5%2B8/$os/$arch/jdk/hotspot/normal/eclipse"
          echo "JDK_FILE=$RUNNER_TEMP/jdk.$ext" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          jdkFile: ${{ env.JDK_FILE }}
          java-version: "25.0.5"
      # rustup reads rust-toolchain.toml and installs the pinned toolchain with rustfmt and clippy.
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every challenge's tests, each compiled on its own (see xtask/src/check.rs).
      - run: cargo xtask check all

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The exact Temurin build the book's numbers come from. setup-java's version matching
      # can't resolve a build number on every runner, so download it from Adoptium.
      - name: Download Temurin 25.0.5+8
        shell: bash
        run: |
          os=$(case "$RUNNER_OS" in Linux) echo linux;; macOS) echo mac;; Windows) echo windows;; esac)
          arch=$(case "$RUNNER_ARCH" in X64) echo x64;; ARM64) echo aarch64;; esac)
          ext=$([ "$os" = windows ] && echo zip || echo tar.gz)
          curl -fsSL -o "$RUNNER_TEMP/jdk.$ext" \
            "https://api.adoptium.net/v3/binary/version/jdk-25.0.5%2B8/$os/$arch/jdk/hotspot/normal/eclipse"
          echo "JDK_FILE=$RUNNER_TEMP/jdk.$ext" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: jdkfile
          jdkFile: ${{ env.JDK_FILE }}
          java-version: "25.0.5"
      - run: rustup show
      - run: cargo test --workspace --no-fail-fast
